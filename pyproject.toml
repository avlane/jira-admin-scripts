[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jira-admin-scripts"
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["requests>=2.22"]
authors = [{ name = "Avery Lane" }]

[project.scripts]
jiraadmin = "jiraadmin.cli:main"
